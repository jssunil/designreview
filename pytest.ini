[pytest]
testpaths = tests
pythonpath = .
addopts = -ra
markers =
    live: calls the real AgentSwitch platform (needs .env credentials, network)
    agent: runs the full agent end to end (costs LLM calls)
    keystone: runs against the Keystone (US) tenant
    writes: creates or changes platform records (use only records the team created)
    gateway_live: real calls to LLM providers (needs API keys, costs a fraction of a cent)

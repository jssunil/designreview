# Provider routing for agentkit/llm/gateway.py (validated by a pydantic model).
#
# A tier's providers are tried top to bottom. A provider is skipped when its
# API key env var is unset, or while it is cooling down after failures.
# `model` is the default; `model_env` (if set in the environment) overrides it,
# so a model can be changed in .env without editing this file.
#
# Model ids checked 2026-09-28 against each provider's /models list (groq and
# cerebras no longer serve llama-3.3-70b; nvidia retired meta/llama-3.3-70b-instruct
# on 2026-08-26). Anthropic: claude-opus-5 is the default current model; this
# project's .env pins ANTHROPIC_MODEL=claude-sonnet-4-6.
#
# A row with `url` (and optionally `url_env`) is any OpenAI-compatible endpoint: no code change
# needed. DeepSeek, Moonshot (Kimi) and LM Studio are such rows; their model ids were read from
# each one's /models list on 2026-10-14 (deepseek: deepseek-v4-pro, deepseek-flash; moonshot:
# kimi-k2.6, kimi-k3; LM Studio: whatever is loaded locally).
#
# More keys for one row (each with its own rate window and cool-down, used in turn; a rate limit,
# a bad key or a spent budget cools only that key), and this row's own cool-downs in seconds:
#
#   key_env = "GROQ_API_KEY"
#   key_envs = ["GROQ_API_KEY_2", "GROQ_API_KEY_3"]   # an unset name is ignored with a warning
#   cooldown_s = 10          # after a rate limit or a busy server (default 20)
#   auth_cooldown_s = 600    # after 401/402/403 (default 300)

[[providers]]
name = "deepseek"
model = "deepseek-v4-pro"
model_env = "DEEPSEEK_MODEL"
key_env = "DEEPSEEK_API_KEY"
url = "https://api.deepseek.com"
url_env = "DEEPSEEK_API_URL"
rpm = 60
timeout = 120

[[providers]]
name = "deepseek_flash"     # same key, the cheap fast model: first in the `fast` tier (cascade drafts)
model = "deepseek-flash"
model_env = "DEEPSEEK_FLASH_MODEL"
key_env = "DEEPSEEK_API_KEY"
url = "https://api.deepseek.com"
url_env = "DEEPSEEK_API_URL"
rpm = 60

[[providers]]
name = "moonshot"
model = "kimi-k2.6"
model_env = "MOONSHOT_MODEL"
key_env = "MOONSHOT_API_KEY"
url = "https://api.moonshot.ai/v1"
url_env = "MOONSHOT_API_URL"
temperature = 1         # kimi-k2.6 rejects any other value (HTTP 400, 2026-10-14)
rpm = 30
timeout = 120

# OpenAI GPT-6 (https://developers.openai.com/api/docs/models, read 2026-10-14): astra $10/$50 per 1M
# tokens (not used: far more than a short audited narration needs), 6.1-sol $2/$10, luna $0.10/$0.50.
# They are reasoning models: "max_completion_tokens", and a temperature other than 1 only with
# reasoning_effort = "none" (luna only; sol's lowest effort is "low"). Their own key (OPENAI_API_KEY2):
# OPENAI_API_KEY stays the official runner's endpoint (the `openai` provider the gateway adds itself).

[[providers]]
name = "openai_luna"        # cheap draft (fast tier): the claim audit decides whether it stands
model = "gpt-6-luna"
model_env = "OPENAI_FAST_MODEL2"
key_env = "OPENAI_API_KEY2"
url = "https://api.openai.com/v1"
max_tokens_field = "max_completion_tokens"
reasoning_effort = "none"
rpm = 60
timeout = 120

[[providers]]
name = "openai_sol"         # quality tier: a draft the audit rejected is rewritten here
model = "gpt-6.1-sol"
model_env = "OPENAI_MODEL2"
key_env = "OPENAI_API_KEY2"
url = "https://api.openai.com/v1"
max_tokens_field = "max_completion_tokens"
reasoning_effort = "low"
temperature = 1
rpm = 60
timeout = 120

# Gemini (models read from GEMINI_API_KEY_2's list, 2026-10-14): GEMINI_API_KEY's prepaid credit is used up
# (HTTP 402 on every model); key 2 is a free tier: pro models (gemini-4-argon, gemini-3.1-pro-preview) have no
# quota there (429), gemini-2.5-flash is closed to new users (404). Flash models can be busy (503): the gateway
# cools the row down and moves on.

[[providers]]
name = "gemini"             # quality / default
# gemini-3.5..3.8-flash all answered 503 (busy) on the free key, 2026-10-14; set GEMINI_MODEL=gemini-3.8-flash
# once they answer or the key has billing.
model = "gemini-3-flash-preview"
model_env = "GEMINI_MODEL"
key_env = "GEMINI_API_KEY_2"
rpm = 10
timeout = 120

[[providers]]
name = "gemini_lite"        # fast tier (cascade drafts)
api = "gemini"
model = "gemini-3.5-flash-lite"
model_env = "GEMINI_FAST_MODEL"
key_env = "GEMINI_API_KEY_2"
rpm = 15

[[providers]]
name = "groq"
model = "openai/gpt-oss-120b"
model_env = "GROQ_MODEL"
key_env = "GROQ_API_KEY"
rpm = 30

[[providers]]
name = "cerebras"
model = "gpt-oss-120b"
model_env = "CEREBRAS_MODEL"
key_env = "CEREBRAS_API_KEY"
rpm = 30

# Anthropic (platform.claude.com pricing, 2026-10-14, per 1M tokens in/out): haiku-5-5 $0.10/$0.50,
# sonnet-5-5 $2/$10, opus-5-5 $4/$20 (not used: more than an audited narration needs). The 5.x models take
# no temperature (the gateway leaves it out for them).

[[providers]]
name = "anthropic"          # quality / default
model = "claude-sonnet-5-5"
model_env = "ANTHROPIC_MODEL"
key_env = "ANTHROPIC_API_KEY"
rpm = 50
timeout = 120

[[providers]]
name = "anthropic_haiku"    # fast tier (cascade drafts)
api = "anthropic"
model = "claude-haiku-5-5"
model_env = "ANTHROPIC_FAST_MODEL"
key_env = "ANTHROPIC_API_KEY"
rpm = 50

[[providers]]
name = "nvidia"
model = "mistralai/mistral-large-2-instruct"
model_env = "NVIDIA_MODEL"
key_env = "NVIDIA_API_KEY"
rpm = 30

[[providers]]
name = "openrouter"
model = "meta-llama/llama-3.3-70b-instruct"
model_env = "OPENROUTER_MODEL"
key_env = "OPEN_ROUTER_API_KEY"
rpm = 20

[[providers]]
name = "ollama"
model = "gemma:latest"
model_env = "OLLAMA_MODEL"
keyless = true          # local, no API key
rpm = 120
timeout = 180

[[providers]]
name = "lmstudio"
model = "google/gemma-4-e4b"
model_env = "LMSTUDIO_MODEL"
keyless = true          # local LM Studio server, no API key
url = "http://127.0.0.1:1235/v1"
url_env = "LMSTUDIO_URL"
rpm = 120
timeout = 180

[tiers]
# Order (2026-10-14): OpenAI GPT-6, DeepSeek, Moonshot (Kimi), Gemini, Anthropic; the other hosted providers next; local LM Studio, then Ollama, last.
default = ["openai_sol", "deepseek", "moonshot", "gemini", "anthropic", "groq", "cerebras", "nvidia", "openrouter", "lmstudio", "ollama"]
# Cheap/fast tier for high-volume, low-stakes calls (cascade drafts, the eval judge).
fast = ["openai_luna", "deepseek_flash", "moonshot", "gemini_lite", "anthropic_haiku", "groq", "cerebras", "nvidia", "lmstudio", "ollama"]
# Quality tier for the final answer.
quality = ["openai_sol", "deepseek", "moonshot", "gemini", "anthropic", "openrouter", "nvidia", "lmstudio", "ollama"]

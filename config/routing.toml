# Provider routing for agentkit/llm/gateway.py (validated by a pydantic model).
#
# A tier's providers are tried top to bottom. A provider is skipped when its
# API key env var is unset, or while it is cooling down after failures.
# `model` is the default; `model_env` (if set in the environment) overrides it,
# so a model can be changed in .env without editing this file.
#
# Model ids checked 2026-09-28 against each provider's /models list (groq and
# cerebras no longer serve llama-3.3-70b; nvidia retired meta/llama-3.3-70b-instruct
# on 2026-08-26). Anthropic: claude-opus-5 is the default current model; this
# project's .env pins ANTHROPIC_MODEL=claude-sonnet-4-6.

[[providers]]
name = "gemini"
model = "gemini-2.5-flash"
model_env = "GEMINI_MODEL"
key_env = "GEMINI_API_KEY"
rpm = 60

[[providers]]
name = "groq"
model = "openai/gpt-oss-120b"
model_env = "GROQ_MODEL"
key_env = "GROQ_API_KEY"
rpm = 30

[[providers]]
name = "cerebras"
model = "gpt-oss-120b"
model_env = "CEREBRAS_MODEL"
key_env = "CEREBRAS_API_KEY"
rpm = 30

[[providers]]
name = "anthropic"
model = "claude-opus-5"
model_env = "ANTHROPIC_MODEL"
key_env = "ANTHROPIC_API_KEY"
rpm = 50
timeout = 120

[[providers]]
name = "nvidia"
model = "mistralai/mistral-large-2-instruct"
model_env = "NVIDIA_MODEL"
key_env = "NVIDIA_API_KEY"
rpm = 30

[[providers]]
name = "openrouter"
model = "meta-llama/llama-3.3-70b-instruct"
model_env = "OPENROUTER_MODEL"
key_env = "OPEN_ROUTER_API_KEY"
rpm = 20

[[providers]]
name = "ollama"
model = "gemma:latest"
model_env = "OLLAMA_MODEL"
keyless = true          # local, no API key
rpm = 120
timeout = 180

[tiers]
# Strongest general-purpose reasoning first; local Ollama last.
default = ["gemini", "groq", "cerebras", "anthropic", "nvidia", "openrouter", "ollama"]
# Cheap/fast tier for high-volume, low-stakes calls (e.g. the eval judge).
fast = ["groq", "cerebras", "gemini", "nvidia", "ollama"]
# Quality tier for the final answer.
quality = ["anthropic", "gemini", "openrouter", "nvidia", "ollama"]
